# ─────────────────────────────────────────────────
# WatchSpace — Backend CI/CD
# ─────────────────────────────────────────────────
name: Backend CI/CD

on:
  push:
    branches: [main, dev]
    paths:
      - 'apps/server/**'
      - 'packages/shared/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

# Cancel in-progress runs for the same branch
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 'latest'

jobs:
  # ── Lint ─────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint --filter=@watchspace/server --filter=@watchspace/shared

      - name: Check Prettier formatting
        run: bunx prettier --check "apps/server/**/*.ts" "packages/shared/**/*.ts"

  # ── Tests (Bun test runner) ──────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build shared package
        run: bun run build --filter=@watchspace/shared

      - name: Run tests with coverage
        run: bun test --coverage
        working-directory: apps/server
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_TOKEN }}

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: apps/server/coverage/
          retention-days: 7

  # ── Deploy to Render (main only) ─────────────
  deploy:
    name: Trigger Render Deployment
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

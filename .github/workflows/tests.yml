# ─────────────────────────────────────────────────
# WatchSpace — Pull Request Test Gate
# ─────────────────────────────────────────────────
name: PR Test Gate

on:
  pull_request:
    branches: [master, dev]
    types: [opened, synchronize, reopened]

# Cancel in-progress runs for the same PR
concurrency:
  group: pr-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BUN_VERSION: 'latest'

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  # ── Full Lint Pass ───────────────────────────
  lint:
    name: Lint All
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: ESLint (all packages)
        run: bun run lint

      - name: Prettier check (all files)
        run: bun run format:check

  # ── Frontend Tests ───────────────────────────
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build shared package
        run: bun run build --filter=@watchspace/shared

      - name: Run Vitest with coverage
        run: bun run test --filter=@watchspace/web -- --coverage --coverage.reporter=json-summary --coverage.reporter=text
        env:
          VITE_API_URL: http://localhost:3001/api
          VITE_SIGNALING_URL: ws://localhost:3001/ws

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-pr
          path: apps/web/coverage/
          retention-days: 3

  # ── Backend Tests ────────────────────────────
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build shared package
        run: bun run build --filter=@watchspace/shared

      - name: Run Bun tests with coverage
        run: bun test --coverage
        working-directory: apps/server
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_TOKEN }}

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-pr
          path: apps/server/coverage/
          retention-days: 3

  # ── Post Coverage Report as PR Comment ───────
  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [frontend-tests, backend-tests]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage-pr
          path: coverage/frontend
        continue-on-error: true

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage-pr
          path: coverage/backend
        continue-on-error: true

      - name: Generate coverage comment
        id: coverage
        run: |
          echo "## 📊 Test Coverage Report" > coverage-report.md
          echo "" >> coverage-report.md
          echo "### Frontend" >> coverage-report.md

          if [ -f "coverage/frontend/coverage-summary.json" ]; then
            node -e "
              const c = require('./coverage/frontend/coverage-summary.json').total;
              const fmt = (v) => v.pct + '%';
              console.log('| Metric | Coverage |');
              console.log('|--------|----------|');
              console.log('| Statements | ' + fmt(c.statements) + ' |');
              console.log('| Branches | ' + fmt(c.branches) + ' |');
              console.log('| Functions | ' + fmt(c.functions) + ' |');
              console.log('| Lines | ' + fmt(c.lines) + ' |');
            " >> coverage-report.md
          else
            echo "_No frontend coverage data available._" >> coverage-report.md
          fi

          echo "" >> coverage-report.md
          echo "### Backend" >> coverage-report.md

          if [ -d "coverage/backend" ]; then
            echo "_Backend coverage collected via Bun's built-in coverage._" >> coverage-report.md
          else
            echo "_No backend coverage data available._" >> coverage-report.md
          fi

          echo "" >> coverage-report.md
          echo "---" >> coverage-report.md
          echo "_Generated by CI on $(date -u +%Y-%m-%dT%H:%M:%SZ)_" >> coverage-report.md

      - name: Post coverage comment on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage-report
          path: coverage-report.md

  # ── Final Status Check (merge gate) ──────────
  pr-status:
    name: PR Status Check
    runs-on: ubuntu-latest
    needs: [lint, frontend-tests, backend-tests]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "❌ Lint failed"
            exit 1
          fi
          if [ "${{ needs.frontend-tests.result }}" != "success" ]; then
            echo "❌ Frontend tests failed"
            exit 1
          fi
          if [ "${{ needs.backend-tests.result }}" != "success" ]; then
            echo "❌ Backend tests failed"
            exit 1
          fi
          echo "✅ All checks passed"

# ─────────────────────────────────────────────────
# WatchSpace — Frontend CI/CD
# ─────────────────────────────────────────────────
name: Frontend CI/CD

on:
  push:
    branches: [master, dev]
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

# Cancel in-progress runs for the same branch
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  BUN_VERSION: 'latest'

jobs:
  # ── Lint & Format Check ──────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint --filter=@watchspace/web --filter=@watchspace/shared

      - name: Check Prettier formatting
        run: bunx prettier --check "apps/web/**/*.{ts,svelte,js,json,css}" "packages/shared/**/*.ts"

  # ── Unit Tests (Vitest) ──────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build shared package
        run: bun run build --filter=@watchspace/shared

      - name: Run Vitest
        run: bun run test --filter=@watchspace/web -- --coverage --reporter=verbose
        env:
          VITE_API_URL: http://localhost:3001/api
          VITE_SIGNALING_URL: ws://localhost:3001/ws

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: apps/web/coverage/
          retention-days: 7

  # ── E2E Tests (Playwright) ───────────────────
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Build shared package
        run: bun run build --filter=@watchspace/shared

      - name: Build frontend
        run: bun run build --filter=@watchspace/web
        env:
          VITE_API_URL: http://localhost:3001/api
          VITE_SIGNALING_URL: ws://localhost:3001/ws

      - name: Run Playwright tests
        run: bunx playwright test
        working-directory: apps/web
        env:
          VITE_API_URL: http://localhost:3001/api
          VITE_SIGNALING_URL: ws://localhost:3001/ws

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # ── Deploy to Vercel (master only) ─────────────
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ steps.vercel-deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Vercel CLI
        run: bun add -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web

      - name: Build for production
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web
        env:
          VITE_API_URL: ${{ secrets.PRODUCTION_API_URL }}
          VITE_SIGNALING_URL: ${{ secrets.PRODUCTION_WS_URL }}
          VITE_METERED_API_KEY: ${{ secrets.METERED_TURN_KEY }}

      - name: Deploy to Vercel
        id: vercel-deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
        working-directory: apps/web

      - name: Post deployment URL
        run: echo "🚀 Deployed to ${{ steps.vercel-deploy.outputs.url }}"
